<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Накладные — карточки для видео</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root { --bg: #0E0F11; --panel: #17191C; --line: #26292E; --text: #F1F2F3; --mute: #8B9097; --acc: #FF3B5C; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
       padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
h1 { font-size: 22px; letter-spacing: -.02em; }
.sub { color: var(--mute); font-size: 13px; margin: 2px 0 14px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--panel); padding: 4px; border-radius: 12px; }
.tabs button { border: 0; background: none; color: var(--mute); font: 600 13px system-ui, sans-serif; padding: 10px 4px; border-radius: 9px; }
.tabs button.on { background: var(--text); color: var(--bg); }
.stage { margin: 14px 0; border-radius: 14px; padding: 22px 12px; display: grid; place-items: center; min-height: 170px;
         background: repeating-conic-gradient(#1C1E22 0 25%, #15171A 0 50%) 0 0 / 22px 22px; }
.stage canvas { max-width: 100%; height: auto; }
.f { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label { display: grid; gap: 5px; font-size: 12px; color: var(--mute); }
input, textarea { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 10px;
                  padding: 11px 12px; font: 15px system-ui, sans-serif; }
textarea { min-height: 70px; resize: vertical; }
input:focus, textarea:focus { outline: none; border-color: #4A4F57; }
.chk { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); background: var(--panel);
       border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
.chk input { width: 18px; height: 18px; accent-color: var(--acc); }
.ava { display: flex; align-items: center; gap: 12px; }
.ava img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: var(--panel); }
.ava label { flex: 1; }
.ava input[type=file] { padding: 9px; font-size: 13px; }
.hide { display: none !important; }
.save { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); width: min(528px, calc(100% - 32px));
        border: 0; border-radius: 14px; padding: 16px; background: var(--acc); color: #fff; font: 700 16px system-ui, sans-serif; }
.out { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: grid; place-items: center; padding: 24px; z-index: 9; }
.out img { max-width: 100%; max-height: 70vh; background: repeating-conic-gradient(#222 0 25%, #1a1a1a 0 50%) 0 0 / 18px 18px; border-radius: 10px; }
.out p { color: var(--mute); text-align: center; font-size: 13px; margin-top: 12px; }
.out button { margin-top: 12px; width: 100%; border: 0; border-radius: 12px; padding: 14px; font: 600 15px system-ui, sans-serif; background: var(--panel); color: var(--text); }
</style>
</head>
<body>
<h1>Накладные</h1>
<p class="sub">Комментарий, уведомление или пост — прозрачный PNG для видео</p>
<div class="tabs" id="tabs">
  <button data-t="comment" class="on">Комментарий</button>
  <button data-t="notif">Уведомление</button>
  <button data-t="threads">Threads</button>
</div>
<div class="stage"><canvas id="cv"></canvas></div>
<div class="f">
  <div class="ava g-c g-t">
    <img id="avaPrev" alt="">
    <label>Аватарка<input type="file" id="ava" accept="image/*"></label>
  </div>
  <label class="g-c g-t">Ник<input id="nick" value="ladygaga"></label>
  <label class="g-c g-t">Текст<textarea id="text">Обожаю твой контент. Выкладывай чаще!</textarea></label>
  <div class="row g-c">
    <label>Когда<input id="time" value="2 дн."></label>
    <label>Лайки<input id="likes" value="778" inputmode="numeric"></label>
  </div>
  <div class="row g-n"><label>💬 Комментарии<input id="nc" value="100" inputmode="numeric"></label><label>❤ Лайки<input id="nl" value="100" inputmode="numeric"></label></div>
  <label class="g-n">👤 Подписчики<input id="nf" value="100" inputmode="numeric"></label>
  <label class="chk g-c g-t"><input type="checkbox" id="ver" checked>Синяя галочка</label>
  <label class="chk g-c g-t"><input type="checkbox" id="light">Светлая тема</label>
</div>
<button class="save" id="save">Сохранить PNG</button>
<div class="out hide" id="out"><div><img id="res" alt=""><p>Зажми картинку, чтобы сохранить, или нажми «Поделиться»</p>
  <button id="share">Поделиться</button><button id="close">Назад</button></div></div>
<script>
const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
const $ = id => document.getElementById(id), cv = $("cv"), S = 3;  // S — масштаб: картинка в 3 раза чётче экрана
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
let tpl = "comment", avatar = null;

function ctx(w, h) { cv.width = w * S; cv.height = h * S; cv.style.width = w + "px"; const c = cv.getContext("2d"); c.scale(S, S); return c; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function wrap(c, text, maxW) {  // перенос строк по ширине
  const out = [];
  for (const para of text.split("\n")) {
    let line = "";
    for (const w of para.split(" ")) {
      const t = line ? line + " " + w : w;
      if (c.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function ava(c, x, y, d) {
  c.save(); c.beginPath(); c.arc(x + d / 2, y + d / 2, d / 2, 0, 7); c.clip();
  if (avatar) { const s = Math.min(avatar.width, avatar.height); c.drawImage(avatar, (avatar.width - s) / 2, (avatar.height - s) / 2, s, s, x, y, d, d); }
  else { c.fillStyle = "#8B9097"; c.fillRect(x, y, d, d); }
  c.restore();
}
function badge(c, x, y, r) {  // галочка верификации: зубчатый круг + белая галка
  c.beginPath();
  for (let i = 0; i < 24; i++) { const a = i * Math.PI / 12, rad = i % 2 ? r * .86 : r; c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  c.closePath(); c.fillStyle = "#0095F6"; c.fill();
  c.beginPath(); c.moveTo(x - r * .4, y); c.lineTo(x - r * .1, y + r * .32); c.lineTo(x + r * .45, y - r * .3);
  c.strokeStyle = "#fff"; c.lineWidth = r * .26; c.lineCap = c.lineJoin = "round"; c.stroke();
}
function heart(c, x, y, s, fill) {  // сердце с центром (x, y), ширина s
  c.beginPath(); c.moveTo(x, y + s * .35);
  c.bezierCurveTo(x - s * .6, y - s * .05, x - s * .35, y - s * .55, x, y - s * .2);
  c.bezierCurveTo(x + s * .35, y - s * .55, x + s * .6, y - s * .05, x, y + s * .35);
  c.fillStyle = fill; c.fill();
}

function drawComment() {
  const L = $("light").checked, W = 360, pad = 16, av = 40, tx = pad + av + 12, tw = W - tx - 46;
  const meas = cv.getContext("2d"); meas.font = `400 15px ${FONT}`;
  const lines = wrap(meas, $("text").value, tw);
  const H = pad + 20 + 4 + lines.length * 20 + 8 + 18 + pad;
  const c = ctx(W, H);
  rr(c, 0, 0, W, H, 22); c.fillStyle = L ? "#FFFFFF" : "#262626"; c.fill();
  ava(c, pad, pad, av);
  c.font = `600 14px ${FONT}`; c.fillStyle = L ? "#000" : "#F5F5F5"; c.textBaseline = "top";
  const nick = $("nick").value; c.fillText(nick, tx, pad + 1); let nx = tx + c.measureText(nick).width + 4;
  if ($("ver").checked) { badge(c, nx + 7, pad + 9, 7); nx += 18; }
  c.font = `400 13px ${FONT}`; c.fillStyle = "#8E8E8E"; c.fillText($("time").value, nx + 4, pad + 2);
  c.font = `400 15px ${FONT}`; c.fillStyle = L ? "#000" : "#F5F5F5";
  lines.forEach((l, i) => c.fillText(l, tx, pad + 24 + i * 20));
  c.font = `600 12px ${FONT}`; c.fillStyle = "#8E8E8E"; c.fillText("Ответить", tx, pad + 24 + lines.length * 20 + 8);
  heart(c, W - pad - 12, pad + 18, 16, "#FF3040");
  c.font = `400 12px ${FONT}`; c.fillStyle = "#8E8E8E"; c.textAlign = "center"; c.fillText($("likes").value, W - pad - 12, pad + 30);
}

function drawNotif() {
  const vals = [["c", $("nc").value], ["h", $("nl").value], ["p", $("nf").value]];
  const meas = cv.getContext("2d"); meas.font = `600 22px ${FONT}`;
  const parts = vals.filter(v => v[1]).map(([k, v]) => [k, v, 30 + 8 + meas.measureText(v).width]);
  const pad = 22, gap = 26, W = pad * 2 + parts.reduce((a, p) => a + p[2], 0) + gap * (parts.length - 1), H = 66, tip = 12;
  const c = ctx(W, H + tip);
  c.fillStyle = "#FF3040"; rr(c, 0, tip, W, H, 16); c.fill();
  c.beginPath(); c.moveTo(W - 64, tip + 1); c.lineTo(W - 52, 0); c.lineTo(W - 40, tip + 1); c.fill();  // хвостик к сердечку в шапке
  let x = pad; const cy = tip + H / 2;
  for (const [k, v, w] of parts) {
    c.fillStyle = "#fff";
    if (k === "h") heart(c, x + 15, cy, 28, "#fff");
    if (k === "c") { c.beginPath(); c.arc(x + 15, cy - 1, 13, 0, 7); c.moveTo(x + 4, cy + 7); c.lineTo(x + 2, cy + 14); c.lineTo(x + 10, cy + 11); c.fill(); }
    if (k === "p") { c.beginPath(); c.arc(x + 15, cy - 6, 7, 0, 7); c.fill(); rr(c, x + 3, cy + 3, 24, 11, [12, 12, 3, 3]); c.fill(); }
    c.font = `600 22px ${FONT}`; c.textBaseline = "middle"; c.fillText(v, x + 38, cy + 1);
    x += w + gap;
  }
}

function drawThreads() {
  const L = $("light").checked, W = 380, pad = 18, av = 36;
  const meas = cv.getContext("2d"); meas.font = `400 15px ${FONT}`;
  const lines = wrap(meas, $("text").value, W - pad * 2);
  const H = pad + av + 12 + lines.length * 21 + pad;
  const c = ctx(W, H);
  rr(c, 0, 0, W, H, 16); c.fillStyle = L ? "#FFFFFF" : "#101010"; c.fill();
  ava(c, pad, pad, av);
  c.font = `600 15px ${FONT}`; c.fillStyle = L ? "#000" : "#F3F5F7"; c.textBaseline = "middle";
  const nick = $("nick").value; c.fillText(nick, pad + av + 10, pad + av / 2);
  if ($("ver").checked) badge(c, pad + av + 10 + c.measureText(nick).width + 10, pad + av / 2, 7);
  c.fillStyle = L ? "#000" : "#F3F5F7";  // badge() перекрашивает fillStyle в синий
  c.font = `700 24px ${FONT}`; c.textAlign = "right"; c.fillText("@", W - pad, pad + av / 2 + 1);  // знак Threads
  c.textAlign = "left"; c.textBaseline = "top"; c.font = `400 15px ${FONT}`;
  lines.forEach((l, i) => c.fillText(l, pad, pad + av + 12 + i * 21));
}

function draw() {
  document.querySelectorAll(".g-c,.g-n,.g-t").forEach(el => el.classList.add("hide"));
  const cls = { comment: ".g-c", notif: ".g-n", threads: ".g-t" }[tpl];
  document.querySelectorAll(cls).forEach(el => el.classList.remove("hide"));
  ({ comment: drawComment, notif: drawNotif, threads: drawThreads })[tpl]();
}

$("tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b)); tpl = b.dataset.t; draw();
  tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); };
document.querySelectorAll("input:not([type=file]),textarea").forEach(el => el.oninput = draw);
$("ava").onchange = e => { const f = e.target.files[0]; if (!f) return; const img = new Image();
  img.onload = () => { avatar = img; $("avaPrev").src = img.src; draw(); }; img.src = URL.createObjectURL(f); };

let blob = null;
$("save").onclick = () => cv.toBlob(b => {
  blob = b; $("res").src = URL.createObjectURL(b); $("out").classList.remove("hide");
  if (!tg) { const a = document.createElement("a"); a.href = $("res").src; a.download = "nakladnaya.png"; a.click(); }
}, "image/png");
$("share").onclick = async () => {
  const file = new File([blob], "nakladnaya.png", { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); } catch (e) {} }
  else { const a = document.createElement("a"); a.href = $("res").src; a.download = "nakladnaya.png"; a.click(); }
};
$("close").onclick = () => $("out").classList.add("hide");
draw();
</script>
</body>
</html>
