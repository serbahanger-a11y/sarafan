<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сарафан — карточки для видео</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face { font-family: G; src: url(fonts/Geologica.ttf); font-weight: 100 900; font-display: swap; }
@font-face { font-family: M; src: url(fonts/Manrope.ttf); font-weight: 200 800; font-display: swap; }
@font-face { font-family: Script; src: url(fonts/GrandHotel.ttf); font-display: swap; }
/* канон Баха: графит, бирюза, без мадженты; заголовки Geologica, текст Manrope */
:root { --ink: #14171A; --card: #1B1F23; --line: #2A3036; --text: #F2F4F3; --mute: #8A9399; --teal: #14B8A6; --glow: #46E5D0; }
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--ink); color: var(--text); font: 15px/1.45 M, system-ui, sans-serif;
       padding: 20px 16px calc(100px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
.kick { font: 600 10.5px G, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
h1 { font: 900 38px/0.95 G, sans-serif; letter-spacing: -.03em; text-transform: uppercase; margin: 8px 0 8px; }
h1 span { color: var(--glow); }
h2 { font: 800 22px/1 G, sans-serif; letter-spacing: -.02em; text-transform: uppercase; }
.sub { color: var(--mute); font-size: 13.5px; }
.hide { display: none !important; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 10px 12px; text-align: left; color: var(--text); cursor: pointer;
        transition: transform .15s ease-out, border-color .2s; font-family: M, sans-serif; }
.tile:active { transform: scale(.97); }
.tile .pv { height: 112px; border-radius: 10px; display: grid; place-items: center; overflow: hidden; margin-bottom: 10px;
            background: repeating-conic-gradient(#20242A 0 25%, #1A1E22 0 50%) 0 0 / 14px 14px; }
.tile .pv img { max-width: 92%; max-height: 92%; filter: drop-shadow(0 6px 14px rgba(0,0,0,.4)); }
.tile .svc { font: 600 9.5px G, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.tile .svc i { width: 6px; height: 6px; border-radius: 50%; }
.tile b { display: block; font: 700 13px G, sans-serif; letter-spacing: .02em; }
.tile small { color: var(--mute); font-size: 12px; }
.tile.soon { opacity: .45; cursor: default; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.back { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: 600 18px G, sans-serif; flex: none; }
.stage { margin: 0 0 18px; border-radius: 16px; padding: 22px 12px; display: grid; place-items: center; min-height: 160px; border: 1px solid var(--line);
         background: repeating-conic-gradient(#1D2125 0 25%, #171A1D 0 50%) 0 0 / 20px 20px; }
.stage canvas { max-width: 100%; height: auto; filter: drop-shadow(0 12px 30px rgba(0,0,0,.45)); }
.f { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.f > .full { grid-column: 1 / -1; }
label { display: grid; gap: 6px; font: 600 10.5px G, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
input, textarea { width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 10px;
                  padding: 12px 13px; font: 500 15px M, system-ui, sans-serif; letter-spacing: 0; text-transform: none; transition: border-color .2s; }
textarea { min-height: 84px; resize: vertical; field-sizing: content; }
input:focus, textarea:focus { outline: none; border-color: var(--teal); }
.sw { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px 13px; font: 500 14.5px M, sans-serif; letter-spacing: 0; text-transform: none; color: var(--text); cursor: pointer; }
.sw input { appearance: none; width: 42px; height: 24px; padding: 0; border: 0; border-radius: 12px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: transform .2s ease-out; }
.sw input:checked { background: var(--teal); }
.sw input:checked::after { transform: translateX(18px); }
.stars { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
.stars button { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--line); padding: 0 2px; cursor: pointer; }
.stars button.on { color: #FFB020; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 13px 10px; color: var(--text); font: 600 14px M, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn input { display: none; }
.btn img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
.save { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); width: min(528px, calc(100% - 32px));
        border: 0; border-radius: 12px; padding: 17px; background: var(--glow); color: var(--ink); font: 800 14px G, sans-serif; letter-spacing: .1em; text-transform: uppercase;
        box-shadow: 0 10px 40px -12px var(--glow); }
.save:active { transform: translateX(-50%) scale(.98); }
.out { position: fixed; inset: 0; background: rgba(10,12,14,.94); display: grid; place-items: center; padding: 24px; z-index: 9; }
.out > div { width: 100%; max-width: 420px; }
.out img { display: block; margin: 0 auto; max-width: 100%; max-height: 60vh; border-radius: 10px; background: repeating-conic-gradient(#22262A 0 25%, #1A1D20 0 50%) 0 0 / 16px 16px; }
.out p { color: var(--mute); text-align: center; font-size: 13px; margin: 14px 0 4px; }
.out button { margin-top: 10px; width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 15px; font: 700 13px G, sans-serif; letter-spacing: .08em; text-transform: uppercase; background: var(--card); color: var(--text); }
.out button.pri { background: var(--glow); color: var(--ink); border-color: var(--glow); }
</style>
</head>
<body>
<section id="home">
  <div class="kick">Карточки для рилсов и мемов</div>
  <h1>Сарафан<span>.</span></h1>
  <p class="sub">Комментарии, реакции, отзывы и посты — уже заполнены, как настоящие. Поменяй, что хочешь, и сохрани прозрачный PNG.</p>
  <div class="grid" id="tiles"></div>
</section>
<section id="edit" class="hide">
  <div class="top"><button class="back" id="back">←</button><div><div class="kick" id="eSvc"></div><h2 id="eTitle"></h2></div></div>
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="f" id="fields"></div>
  <button class="save" id="save">Сохранить PNG</button>
</section>
<div class="out hide" id="out"><div><img id="res" alt=""><p id="msg"></p>
  <button id="dl" class="pri hide">Скачать на телефон</button><button id="close">Назад</button></div></div>
<script>
const tg = window.Telegram && Telegram.WebApp; if (tg && tg.initData) { tg.ready(); tg.expand(); }
const $ = id => document.getElementById(id), S = 3;  // S — картинка в 3 раза чётче экрана
const API = new URLSearchParams(location.search).get("api") || "";  // сервер на компе (бот передаёт адрес тоннеля)
const SYS = '-apple-system, "SF Pro Text", system-ui, Roboto, "Segoe UI", sans-serif';  // так рисует сам Instagram на телефоне
const MEAS = document.createElement("canvas").getContext("2d"), MINI = document.createElement("canvas");

// ── лица и имена: всё заполнено заранее, «🎲» перемешивает ──
let FACES = [], userAva = null;
fetch("faces/index.json").then(r => r.json()).then(list => {
  let left = list.length;
  FACES = list.map(f => { const im = new Image(); im.onload = im.onerror = () => { if (--left === 0) refresh(); }; im.src = "faces/" + f; return im; });
});
const NICKS = ["kate.sokolova", "dima_orlov", "alina.vibe", "max.frost", "lera_prt", "nikita.vs", "sonya_mrr", "artem.rzn", "polina.kiss", "vlad_kr",
  "masha.zhu", "egor.pav", "anya_lvn", "ilya.grom", "dasha.moon", "kirill_tt", "vika.art", "sasha.no", "liza_dream", "roma.kot", "ksu.flow", "timur_88",
  "yana.sun", "denis.vlg", "olya.mint", "gleb_off", "nastya.v", "misha.drive", "alena_pro", "stas.wave"];
const NAMES = ["Анна", "Мария", "Дмитрий", "Екатерина", "Алексей", "Ольга", "Сергей", "Наталья", "Иван", "Юлия", "Михаил", "Ксения", "Артём", "Полина"];
function rnd(seed) { let x = (seed % 233280 + 233280) % 233280 || 1; return () => (x = (x * 9301 + 49297) % 233280) / 233280; }
function shuffled(arr, seed) { const a = arr.slice(), r = rnd(seed); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const faces = (seed, n) => { const a = shuffled(FACES, seed); return Array.from({ length: n }, (_, i) => a[i % Math.max(1, a.length)]); };
const nicks = (seed, n) => shuffled(NICKS, seed + 7).slice(0, n);
const name1 = seed => shuffled(NAMES, seed + 3)[0];
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

// ── рисование ──
function ctx(cv, w, h) { cv.width = w * S; cv.height = h * S; cv.style.width = w + "px"; const c = cv.getContext("2d"); c.scale(S, S); c.textBaseline = "top"; return c; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function wrap(font, text, maxW) {
  MEAS.font = font; const out = [];
  for (const para of String(text || "").split("\n")) {
    if (!para) { out.push(""); continue; }
    let line = "";
    for (const w of para.split(" ")) { const t = line ? line + " " + w : w; if (MEAS.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
    out.push(line);
  }
  return out;
}
function img(c, im, x, y, d) {  // круглая аватарка
  c.save(); c.beginPath(); c.arc(x + d / 2, y + d / 2, d / 2, 0, 7); c.clip();
  if (im && im.complete && im.naturalWidth) { const s = Math.min(im.naturalWidth, im.naturalHeight); c.drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, x, y, d, d); }
  else { c.fillStyle = "#2A2A2A"; c.fillRect(x, y, d, d); }
  c.restore();
}
const mainFace = v => userAva || faces(+v.seed, 1)[0];
function badge(c, x, y, r, color) {  // галочка верификации: зубчатый круг + белая галка
  c.beginPath();
  for (let i = 0; i < 24; i++) { const a = i * Math.PI / 12, rad = i % 2 ? r * .86 : r; c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  c.closePath(); c.fillStyle = color || "#0095F6"; c.fill();
  c.beginPath(); c.moveTo(x - r * .4, y); c.lineTo(x - r * .1, y + r * .32); c.lineTo(x + r * .45, y - r * .3);
  c.strokeStyle = "#fff"; c.lineWidth = r * .26; c.lineCap = c.lineJoin = "round"; c.stroke();
}
function heartPath(c, x, y, s) {  // сердце с центром (x, y), ширина s — форма как в Instagram
  c.beginPath(); c.moveTo(x, y + s * .42);
  c.bezierCurveTo(x - s * .12, y + s * .32, x - s * .5, y + s * .08, x - s * .5, y - s * .14);
  c.bezierCurveTo(x - s * .5, y - s * .36, x - s * .33, y - s * .46, x - s * .2, y - s * .46);
  c.bezierCurveTo(x - s * .08, y - s * .46, x, y - s * .38, x, y - s * .28);
  c.bezierCurveTo(x, y - s * .38, x + s * .08, y - s * .46, x + s * .2, y - s * .46);
  c.bezierCurveTo(x + s * .33, y - s * .46, x + s * .5, y - s * .36, x + s * .5, y - s * .14);
  c.bezierCurveTo(x + s * .5, y + s * .08, x + s * .12, y + s * .32, x, y + s * .42); c.closePath();
}
function heart(c, x, y, s, fill) { heartPath(c, x, y, s); c.fillStyle = fill; c.fill(); }
function bubble(c, x, y, s, fill) {  // облачко комментария с хвостиком слева снизу
  c.beginPath(); c.arc(x, y - s * .03, s * .46, .72 * Math.PI, 2.62 * Math.PI);
  c.lineTo(x - s * .5, y + s * .47); c.closePath(); c.fillStyle = fill; c.fill();
}
function person(c, x, y, s, fill) {
  c.fillStyle = fill; c.beginPath(); c.arc(x, y - s * .2, s * .24, 0, 7); c.fill();
  c.beginPath(); c.moveTo(x - s * .5, y + s * .46); c.lineTo(x - s * .5, y + s * .3);
  c.bezierCurveTo(x - s * .5, y + s * .1, x - s * .3, y + s * .06, x, y + s * .06);
  c.bezierCurveTo(x + s * .3, y + s * .06, x + s * .5, y + s * .1, x + s * .5, y + s * .3); c.lineTo(x + s * .5, y + s * .46); c.closePath(); c.fill();
}
function star(c, cx, cy, r, fill) {
  c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .45 : r; c.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); }
  c.closePath(); c.fillStyle = fill; c.strokeStyle = fill; c.lineWidth = r * .18; c.lineJoin = "round"; c.fill(); c.stroke();
}
function stars(c, x, y, size, gap, n, on, off) { for (let i = 0; i < 5; i++) star(c, x + size / 2 + i * (size + gap), y + size / 2 + .5, size * .48, i < n ? on : off); }
function ring(c, cx, cy, r, w) {  // кольцо непросмотренной сторис
  const g = c.createLinearGradient(cx - r, cy + r, cx + r, cy - r);
  g.addColorStop(0, "#FFC23B"); g.addColorStop(.3, "#FF8A1E"); g.addColorStop(.62, "#F6216B"); g.addColorStop(1, "#C21BD3");
  c.beginPath(); c.arc(cx, cy, r, 0, 7); c.strokeStyle = g; c.lineWidth = w; c.stroke();
}
function fire(c, x, y, s) {
  c.beginPath(); c.moveTo(x, y + s * .5);
  c.bezierCurveTo(x - s * .5, y + s * .45, x - s * .45, y - s * .1, x - s * .1, y - s * .5);
  c.bezierCurveTo(x - s * .05, y - s * .15, x + s * .15, y - s * .2, x + s * .2, y - s * .35);
  c.bezierCurveTo(x + s * .55, y - s * .05, x + s * .5, y + s * .45, x, y + s * .5); c.fillStyle = "#FF7A1A"; c.fill();
  c.beginPath(); c.arc(x, y + s * .22, s * .2, 0, 7); c.fillStyle = "#FFD23F"; c.fill();
}
function pill(c, x, y, v, k) {  // красная плашка активности; k — масштаб; хвостик смотрит вверх справа
  const items = [["c", v.nc], ["h", v.nl], ["p", v.nf]].filter(p => p[1] !== "" && p[1] != null);
  MEAS.font = `600 ${17 * k}px ${SYS}`;
  const iw = 20 * k, gap = 18 * k, pad = 16 * k, H = 46 * k;
  const ws = items.map(([, n]) => iw + 6 * k + MEAS.measureText(n).width);
  const W = pad * 2 + ws.reduce((a, b) => a + b, 0) + gap * Math.max(0, items.length - 1);
  c.fillStyle = "#FF0034"; rr(c, x - W, y + 8 * k, W, H, 14 * k); c.fill();
  c.beginPath(); c.moveTo(x - 46 * k, y + 9 * k); c.lineTo(x - 36 * k, y); c.lineTo(x - 26 * k, y + 9 * k); c.fill();
  let cx = x - W + pad; const cy = y + 8 * k + H / 2;
  items.forEach(([t, n], i) => {
    if (t === "c") bubble(c, cx + iw / 2, cy, iw * .92, "#fff");
    if (t === "h") heart(c, cx + iw / 2, cy + k, iw, "#fff");
    if (t === "p") person(c, cx + iw / 2, cy, iw * .92, "#fff");
    c.fillStyle = "#fff"; c.font = `600 ${17 * k}px ${SYS}`; c.textBaseline = "middle"; c.textAlign = "left"; c.fillText(n, cx + iw + 6 * k, cy + k);
    cx += ws[i] + gap;
  });
  c.textBaseline = "top";
  return W;
}

// ── шаблоны: поля + отрисовка. Всё заполнено «как в жизни», чтобы можно было сохранить сразу ──
const SEED = { k: "seed", t: "dice" }, AVA = { k: "ava", t: "ava" };
const LIGHT = v => ({ k: "light", t: "check", l: "Светлая тема", v });
const T = [
 { id: "ig-stories", svc: "Инстаграм", dot: "#FF0034", title: "Шапка со сторис", hint: "кружки, плашка лайков",
   f: [AVA, SEED, { k: "word", t: "text", l: "Надпись сверху", v: "Instagram" },
       { k: "nc", t: "text", l: "Комментарии", v: "4", half: 1 }, { k: "nl", t: "text", l: "Лайки", v: "37", half: 1 },
       { k: "nf", t: "text", l: "Подписчики", v: "12", half: 1 }, { k: "dot", t: "check", l: "Красная точка у сердца", v: true }],
   draw(cv, v) {
     const W = 393, H = 178, c = ctx(cv, W, H); c.fillStyle = "#0C0C0E"; c.fillRect(0, 0, W, H);
     c.strokeStyle = "#fff"; c.lineWidth = 2.2; c.lineCap = "round";
     c.beginPath(); c.moveTo(16, 26); c.lineTo(36, 26); c.moveTo(26, 16); c.lineTo(26, 36); c.stroke();
     c.fillStyle = "#fff"; c.font = `36px Script, cursive`; c.textBaseline = "middle"; const ww = c.measureText(v.word).width;
     c.fillText(v.word, 104, 27); c.lineWidth = 1.8; c.beginPath(); c.moveTo(104 + ww + 8, 25); c.lineTo(104 + ww + 13, 30); c.lineTo(104 + ww + 18, 25); c.stroke();
     heartPath(c, 357, 27, 26); c.lineWidth = 2.1; c.lineJoin = "round"; c.stroke();
     if (v.dot) { c.fillStyle = "#FF0034"; c.beginPath(); c.arc(368, 16, 4.2, 0, 7); c.fill(); }
     c.textBaseline = "top";
     const d = 70, cy = 92, fs = faces(+v.seed, 4), nk = nicks(+v.seed, 3), xs = [48, 146, 244, 342];
     c.beginPath(); c.arc(xs[0], cy, d / 2 + 5, 0, 7); c.strokeStyle = "#48484A"; c.lineWidth = 1.6; c.stroke();
     img(c, userAva || fs[0], xs[0] - d / 2 + 1, cy - d / 2 + 1, d - 2);
     c.fillStyle = "#fff"; c.beginPath(); c.arc(xs[0] + 25, cy + 25, 11, 0, 7); c.fill(); c.strokeStyle = "#0C0C0E"; c.lineWidth = 3; c.stroke();
     c.strokeStyle = "#0C0C0E"; c.lineWidth = 2.2; c.beginPath(); c.moveTo(xs[0] + 20, cy + 25); c.lineTo(xs[0] + 30, cy + 25); c.moveTo(xs[0] + 25, cy + 20); c.lineTo(xs[0] + 25, cy + 30); c.stroke();
     c.textAlign = "center"; c.font = `400 12.5px ${SYS}`; c.fillStyle = "#A8A8AD"; c.fillText("Ваша история", xs[0], cy + d / 2 + 12);
     nk.forEach((n, i) => { const x = xs[i + 1];
       ring(c, x, cy, d / 2 + 5, 3.2); img(c, fs[i + 1], x - d / 2 + 1, cy - d / 2 + 1, d - 2);
       c.fillStyle = "#F5F5F5"; c.font = `400 12.5px ${SYS}`; c.fillText(n, x, cy + d / 2 + 12); });
     c.textAlign = "left"; pill(c, 393, 38, v, .78);
   } },
 { id: "ig-notif", svc: "Инстаграм", dot: "#FF0034", title: "Плашка лайков", hint: "отдельно, на любой фон",
   f: [{ k: "nc", t: "text", l: "Комментарии", v: "12", half: 1 }, { k: "nl", t: "text", l: "Лайки", v: "148", half: 1 }, { k: "nf", t: "text", l: "Подписчики", v: "31", half: 1 }],
   draw(cv, v) { const c0 = ctx(MINI, 600, 80), w = pill(c0, 600, 0, v, 1); const c = ctx(cv, w + 2, 56); pill(c, w + 1, 0, v, 1); } },
 { id: "ig-comment", svc: "Инстаграм", dot: "#FF0034", title: "Комментарий", hint: "под рилсом",
   f: [AVA, SEED, { k: "nick", t: "text", l: "Ник (пусто — случайный)", v: "" }, { k: "text", t: "area", l: "Текст", v: "Это лучшее, что я видела за неделю 😭🔥 Где ты был раньше?" },
       { k: "time", t: "text", l: "Когда", v: "3 ч.", half: 1 }, { k: "likes", t: "text", l: "Лайки", v: "2 418", half: 1 },
       { k: "ver", t: "check", l: "Синяя галочка", v: false }, LIGHT(false)],
   draw(cv, v) {
     const L = v.light, W = 360, pad = 16, av = 38, tx = pad + av + 12, tl = wrap(`400 14.5px ${SYS}`, v.text, W - tx - 44), nick = v.nick || nicks(+v.seed, 1)[0];
     const H = pad + 22 + tl.length * 19 + 10 + 16 + pad, c = ctx(cv, W, H);

// ── экраны ──
const vals = {};
const defaults = t => Object.fromEntries(t.f.filter(f => "v" in f).map(f => [f.k, f.v]).concat([["seed", 1 + T.indexOf(t) * 17]]));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
let cur = null;
function refresh() { cur ? draw() : renderHome(); }

function renderHome() {
  const grid = $("tiles"); grid.innerHTML = "";
  for (const t of T) {
    const tile = document.createElement("button"); tile.className = "tile" + (t.soon ? " soon" : "");
    let pv = "<span class='kick'>скоро</span>";
    if (!t.soon) { const cv = document.createElement("canvas"); t.draw(cv, vals[t.id] || defaults(t)); pv = `<img src="${cv.toDataURL()}" alt="">`; }
    tile.innerHTML = `<div class="pv">${pv}</div><div class="svc"><i style="background:${t.dot}"></i>${t.svc}</div><b>${t.title}</b><small>${t.hint}</small>`;
    if (!t.soon) tile.onclick = () => open(t);
    grid.appendChild(tile);
  }
}

function open(t) {
  cur = t; vals[t.id] = vals[t.id] || defaults(t);
  $("eSvc").textContent = t.svc; $("eTitle").textContent = t.title;
  const box = $("fields"); box.innerHTML = "";
  const hasAva = t.f.some(f => f.t === "ava"), hasDice = t.f.some(f => f.t === "dice");
  if (hasAva || hasDice) box.insertAdjacentHTML("beforeend", `<div class="row2 full">${hasDice ? `<button type="button" class="btn" id="dice">🎲 Другие люди</button>` : ""}${hasAva ? `<label class="btn" style="text-transform:none;letter-spacing:0;font:600 14px M,sans-serif;color:var(--text)"><img id="avaPrev" alt="" ${userAva ? `src="${userAva.src}"` : "hidden"}>Своя аватарка<input type="file" accept="image/*" id="ava"></label>` : ""}</div>`);
  for (const f of t.f) {
    const v = vals[t.id][f.k], cls = f.half ? "" : "full";
    if (f.t === "check") box.insertAdjacentHTML("beforeend", `<label class="sw full">${f.l}<input type="checkbox" data-k="${f.k}" ${v ? "checked" : ""}></label>`);
    else if (f.t === "stars") box.insertAdjacentHTML("beforeend", `<label class="${cls}">${f.l}<div class="stars" data-k="${f.k}">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-n="${i}" class="${i <= v ? "on" : ""}">★</button>`).join("")}</div></label>`);
    else if (f.t === "area") box.insertAdjacentHTML("beforeend", `<label class="full">${f.l}<textarea data-k="${f.k}">${esc(v)}</textarea></label>`);
    else if (f.t === "text") box.insertAdjacentHTML("beforeend", `<label class="${cls}">${f.l}<input data-k="${f.k}" value="${esc(v)}"></label>`);
  }
  if ($("dice")) $("dice").onclick = () => { vals[t.id].seed = Math.floor(Math.random() * 1e6); draw(); haptic(); };
  if ($("ava")) $("ava").onchange = e => { const file = e.target.files[0]; if (!file) return; const im = new Image();
    im.onload = () => { userAva = im; $("avaPrev").src = im.src; $("avaPrev").hidden = false; draw(); }; im.src = URL.createObjectURL(file); };
  box.querySelectorAll("[data-k]").forEach(el => {
    if (el.classList.contains("stars")) el.onclick = e => { e.preventDefault(); const b = e.target.closest("button"); if (!b) return; vals[t.id][el.dataset.k] = +b.dataset.n;
      el.querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.n <= +b.dataset.n)); draw(); haptic(); };
    else el.oninput = () => { vals[t.id][el.dataset.k] = el.type === "checkbox" ? el.checked : el.value; draw(); };
  });
  $("home").classList.add("hide"); $("edit").classList.remove("hide"); scrollTo(0, 0); draw();
  if (tg && tg.initData) { tg.BackButton.show(); tg.BackButton.onClick(home); }
}
function draw() { cur.draw($("cv"), vals[cur.id]); }
function home() { cur = null; $("edit").classList.add("hide"); $("home").classList.remove("hide"); renderHome(); if (tg && tg.initData) tg.BackButton.hide(); }
function haptic() { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); }
$("back").onclick = home;

// Сохранение: в Telegram обычное скачивание не работает — картинку получает бот и шлёт файлом в чат,
// а «Скачать» идёт через tg.downloadFile по ссылке с нашего сервера.
let saved = null;
$("save").onclick = async () => {
  const png = $("cv").toDataURL("image/png"); $("res").src = png; $("out").classList.remove("hide");
  if (!tg || !tg.initData) { const a = document.createElement("a"); a.href = png; a.download = cur.id + ".png"; a.click(); $("msg").textContent = "Готово — файл скачан"; return; }
  $("msg").textContent = "Отправляю в чат…"; $("dl").classList.add("hide");
  try {
    const r = await fetch(API + "/api/send", { method: "POST", body: JSON.stringify({ init: tg.initData, png, name: cur.id }) }).then(r => r.json());
    saved = r;
    $("msg").textContent = r.ok ? "✓ Файл уже в чате с ботом — оттуда сохраняй или пересылай" : "Не получилось отправить — зажми картинку и сохрани";
    if (r.ok && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) $("dl").classList.remove("hide");
    tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(r.ok ? "success" : "error");
  } catch (e) { $("msg").textContent = "Нет связи с сервером — зажми картинку, чтобы сохранить"; }
};
$("dl").onclick = () => tg.downloadFile({ url: (API || location.origin) + saved.url, file_name: saved.file });
$("close").onclick = () => $("out").classList.add("hide");
document.fonts.ready.then(refresh);
renderHome();
</script>
